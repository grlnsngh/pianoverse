<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pianoverse - Reset Your Password</title>
    <style>
        :root {
            --primary-color: #161622;
            --secondary-color: #FFA001;
            --text-light: #ffffff;
            --text-dark: #161622;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --shadow: rgba(0, 0, 0, 0.1);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--primary-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Background decorative elements */
        .background-decoration {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 1;
        }

        .background-decoration::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 160, 1, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        .background-decoration::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -30%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(255, 160, 1, 0.05) 0%, transparent 70%);
            border-radius: 50%;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px var(--shadow);
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .title {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        .message {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
            color: var(--text-dark);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(255, 160, 1, 0.1);
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        .button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--secondary-color), #ff8c00);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 160, 1, 0.3);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            background: var(--success-color);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #e68900;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }

            .title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-decoration"></div>

    <div class="container">
        <div class="logo">🎹 Pianoverse</div>
        <h1 class="title">Reset Your Password</h1>
        <p class="message">
            Enter your new password below to complete the reset process.
        </p>

        <form id="resetForm">
            <input type="hidden" id="userId" name="userId">
            <input type="hidden" id="secret" name="secret">
            <input type="hidden" id="expire" name="expire">

            <div class="form-group">
                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    class="form-input"
                    placeholder="New password"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-group">
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    class="form-input"
                    placeholder="Confirm your new password"
                    required
                    minlength="6"
                >
                <span class="error-message" id="errorMessage"></span>
            </div>

            <button type="submit" class="button" id="submitButton">
                Update Password
            </button>
        </form>

        <div id="successMessage" class="success-message" style="display: none;">
            Password updated successfully! You can now sign in with your new password.
        </div>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');
        const expire = urlParams.get('expire');

        // Show form if we have the required parameters
        if (userId && secret) {
            document.getElementById('resetForm').style.display = 'block';
            document.getElementById('userId').value = userId;
            document.getElementById('secret').value = secret;
            document.getElementById('expire').value = expire;

            // Hide the initial message
            document.querySelector('.message').style.display = 'none';
        }

        // Handle form submission
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            if (newPassword.length < 6) {
                alert('Password must be at least 6 characters long!');
                return;
            }

            try {
                // Call Appwrite API to update password
                const response = await fetch('https://cloud.appwrite.io/v1/account/recovery', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Appwrite-Project': '66b2693000154e2fa3c8'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        secret: secret,
                        password: newPassword
                    })
                });

                if (response.ok) {
                    alert('Password updated successfully! You can now sign in with your new password.');
                    window.location.href = 'pianoverse://sign-in'; // Try to open app
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.message || 'Failed to update password'));
                }
            } catch (error) {
                alert('Network error. Please try again.');
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
