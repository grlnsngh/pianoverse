<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pianoverse Password Reset</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }
        .title {
            color: #333;
            margin-bottom: 20px;
        }
        .message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .button:hover {
            transform: translateY(-2px);
        }
        .link {
            color: #667eea;
            word-break: break-all;
            font-size: 14px;
            margin-top: 20px;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🎹 Pianoverse</div>
        <h1 class="title">Reset Your Password</h1>
        <p class="message">
            Click the button below to reset your password.
        </p>

        <form id="resetForm" style="display: none;">
            <input type="hidden" id="userId" name="userId">
            <input type="hidden" id="secret" name="secret">
            <input type="hidden" id="expire" name="expire">
            
            <div style="margin-bottom: 20px;">
                <input type="password" id="newPassword" placeholder="New Password" 
                       style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px;" required>
            </div>
            
            <div style="margin-bottom: 20px;">
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" 
                       style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px;" required>
            </div>
            
            <button type="submit" style="width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
                Update Password
            </button>
        </form>

        <div class="footer">
            <p>This link will expire in 1 hour for security reasons.</p>
            <p>If you didn't request this reset, please ignore this email.</p>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');
        const expire = urlParams.get('expire');

        // Show form if we have the required parameters
        if (userId && secret) {
            document.getElementById('resetForm').style.display = 'block';
            document.getElementById('userId').value = userId;
            document.getElementById('secret').value = secret;
            document.getElementById('expire').value = expire;
            
            // Hide the initial message
            document.querySelector('.message').style.display = 'none';
        }

        // Handle form submission
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('Password must be at least 6 characters long!');
                return;
            }
            
            try {
                // Call Appwrite API to update password
                const response = await fetch('https://cloud.appwrite.io/v1/account/recovery', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Appwrite-Project': '66b2693000154e2fa3c8'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        secret: secret,
                        password: newPassword
                    })
                });
                
                if (response.ok) {
                    alert('Password updated successfully! You can now sign in with your new password.');
                    window.location.href = 'pianoverse://sign-in'; // Try to open app
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.message || 'Failed to update password'));
                }
            } catch (error) {
                alert('Network error. Please try again.');
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
