<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select pianos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;font-family:'Figtree',-apple-system,'Segoe UI',sans-serif;color:#1A1814;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;font-family:'Figtree',-apple-system,'Segoe UI',sans-serif;color:#1A1814">

<div style="flex-grow:1;min-height:0;overflow:hidden">

<div style="display:flex;align-items:center;justify-content:space-between;height:56px;padding:8px 8px 0">
<a href="Pianos.dc.html" style="height:44px;padding:0 12px;display:flex;align-items:center;font-size:16px;font-weight:600">Cancel</a>
<div style="font-size:17px;font-weight:700">2 selected</div>
<button type="button" style="height:44px;padding:0 12px;border:0;background:none;font-size:16px;font-weight:600;color:#A85D00">Select all</button>
</div>

<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:20px 12px;padding:16px 20px 0">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<div style="display:block;min-width:0">
<div style="position:relative;height:169px;border-radius:16px;overflow:hidden;background:#E9E1D3">
<svg width="100%" height="100%" viewBox="0 0 160 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="160" fill="{{p.wall}}"/><rect y="112" width="160" height="48" fill="{{p.floor}}"/><ellipse cx="80" cy="115" rx="52" ry="4.5" fill="#1A1814" fill-opacity="0.14"/><g transform="translate(28 40) scale(1.3)"><rect x="8" y="8" width="64" height="6" rx="2" fill="{{p.dark}}"/><rect x="11" y="14" width="58" height="22" rx="1.5" fill="{{p.body}}"/><rect x="17" y="19" width="46" height="12" rx="1" fill="{{p.panel}}"/><rect x="8" y="36" width="64" height="4" rx="1.5" fill="{{p.dark}}"/><rect x="13" y="40" width="54" height="7" fill="#F7F3EA"/><path d="M18.4 40v7M23.8 40v7M29.2 40v7M34.6 40v7M40 40v7M45.4 40v7M50.8 40v7M56.2 40v7M61.6 40v7" stroke="#D2CABB" stroke-width="0.6"/><rect x="17.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="22.6" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="33.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="38.8" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="44.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="55" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="60.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="11" y="47" width="58" height="5" fill="{{p.body}}"/><rect x="11" y="47" width="5" height="11" rx="1" fill="{{p.dark}}"/><rect x="64" y="47" width="5" height="11" rx="1" fill="{{p.dark}}"/></g></svg>
<sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;border-radius:16px;box-shadow:inset 0 0 0 3px #1A1814">
<span style="position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:#1A1814;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
</div>
</sc-if>
<sc-if value="{{p.off}}" hint-placeholder-val="{{ true }}">
<span style="position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.7);border:2px solid #FFFFFF"></span>
</sc-if>
</div>
<div style="margin-top:10px;font-size:15px;font-weight:600;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.title}}</div>
<div style="font-size:14px;font-weight:400;line-height:20px;color:#6B665D;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.company}}</div>
</div>
</sc-for>
</div>

</div>

<div style="flex-shrink:0;padding:12px 20px 28px;background:#FFFFFF;border-top:1px solid #E7E4DD">
<button type="button" style="width:100%;height:52px;border:0;border-radius:14px;background:#C4321C;color:#FFFFFF;font-size:16px;font-weight:700">Delete 2 pianos</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { title: 'Young Chang U-121', company: 'The Piano Services', on: false, off: true, wall: '#E9E1D3', floor: '#D8CDBB', body: '#6A5545', dark: '#4A3B30', panel: '#57453A' },
        { title: 'Samick SU-118', company: 'Kirpalsons', on: true, off: false, wall: '#DDE3DC', floor: '#C9D1C7', body: '#34302E', dark: '#24211F', panel: '#2B2826' },
        { title: 'Schimmel W114', company: 'Shamshersons', on: true, off: false, wall: '#EFE9E0', floor: '#DDD5C8', body: '#F4F1EA', dark: '#D9D3C6', panel: '#E6E0D3' },
        { title: 'Weber W-121', company: 'RS Music Center', on: false, off: true, wall: '#E8DDD9', floor: '#D8CBC6', body: '#7A3E2F', dark: '#5A2B20', panel: '#683528' }
      ]
    };
  }
}
</script>
</body>
</html>
