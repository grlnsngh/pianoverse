<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}

</style>
</helmet>

</div>
<div style="width:40px;height:40px;flex-shrink:0;border:1px solid #D9D5CC;border-radius:50%;display:flex;align-items:center;justify-content:center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1814" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</div>
</div>
<div style="width:44px;height:44px;flex-shrink:0;border-radius:50%;background:#FF9C01;color:#1A1814;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</div>
</div>

<div style="display:flex;margin-top:8px;padding:0 12px;border-bottom:1px solid #E7E4DD">

<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#6B665D;font-size:12px;font-weight:600;line-height:16px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM11 12l9-9M16 7l3 3"/></svg>Rentable</div>

<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#6B665D;font-size:12px;font-weight:600;line-height:16px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12.5V4.5h8l9 9-8 8-9-9zM8 8.5h.01"/></svg>On sale</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;color:#6B665D;font-size:12px;font-weight:600;line-height:16px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8"/></svg>Warehouse</div>
</div>

<div style="display:flex;align-items:center;gap:10px;padding:10px 20px;background:#F6F5F2;border-bottom:1px solid #E7E4DD">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B665D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>
<div style="font-size:13px;font-weight:500;line-height:18px;color:#3C3831"><b style="font-weight:700">Offline.</b> Showing pianos saved on 28 Sep, 6:40 pm.</div>
</div>

<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:20px 12px;padding:16px 20px 0">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<div style="min-width:0">
<div style="position:relative;height:169px;border-radius:16px;overflow:hidden;background:#E9E1D3">
<svg width="100%" height="100%" viewBox="0 0 160 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="160" fill="{{p.wall}}"/><rect y="112" width="160" height="48" fill="{{p.floor}}"/><ellipse cx="80" cy="115" rx="52" ry="4.5" fill="#1A1814" fill-opacity="0.14"/><g transform="translate(28 40) scale(1.3)"><rect x="8" y="8" width="64" height="6" rx="2" fill="{{p.dark}}"/><rect x="11" y="14" width="58" height="22" rx="1.5" fill="{{p.body}}"/><rect x="17" y="19" width="46" height="12" rx="1" fill="{{p.panel}}"/><rect x="8" y="36" width="64" height="4" rx="1.5" fill="{{p.dark}}"/><rect x="13" y="40" width="54" height="7" fill="#F7F3EA"/><path d="M18.4 40v7M23.8 40v7M29.2 40v7M34.6 40v7M40 40v7M45.4 40v7M50.8 40v7M56.2 40v7M61.6 40v7" stroke="#D2CABB" stroke-width="0.6"/><rect x="17.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="22.6" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="33.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="38.8" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="44.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="55" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="60.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="11" y="47" width="58" height="5" fill="{{p.body}}"/><rect x="11" y="47" width="5" height="11" rx="1" fill="{{p.dark}}"/><rect x="64" y="47" width="5" height="11" rx="1" fill="{{p.dark}}"/></g></svg>
<sc-if value="{{p.red}}" hint-placeholder-val="{{ false }}">
<span style="position:absolute;left:8px;top:8px;padding:2px 9px;border-radius:999px;background:#C4321C;color:#FFFFFF;font-size:12px;font-weight:700;line-height:18px">{{p.badge}}</span>
</sc-if>
</div>
<div style="margin-top:10px;font-size:15px;font-weight:600;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.title}}</div>
<div style="font-size:14px;font-weight:400;line-height:20px;color:#6B665D">{{p.company}}</div>
<div style="font-size:14px;font-weight:700;line-height:20px">{{p.price}}</div>
</div>
</sc-for>
</div>

</div>

<nav aria-label="Main" style="height:84px;flex-shrink:0;display:flex;padding-top:8px;background:#FFFFFF;border-top:1px solid #E7E4DD">
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#77716A;font-size:11px;font-weight:600;line-height:14px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Today</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#1A1814;font-size:11px;font-weight:700;line-height:14px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M9 19v-4M15 19v-4M7.5 5v6M12 5v6M16.5 5v6"/></svg>Pianos</div>
<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#77716A;font-size:11px;font-weight:600;line-height:14px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>Account</div>
</nav>

</div>
</x-dc>

        { title: 'Weber W-121', company: 'RS Music Center', price: '₹5,000', red: true, badge: 'Overdue · 18 days', wall: '#E8DDD9', floor: '#D8CBC6', body: '#7A3E2F', dark: '#5A2B20', panel: '#683528' }
      ]
    };
  }
}
</script>
</body>
</html>
