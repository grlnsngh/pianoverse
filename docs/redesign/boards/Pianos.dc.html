<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pianos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;font-family:'Figtree',-apple-system,'Segoe UI',sans-serif;color:#1A1814;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;font-family:'Figtree',-apple-system,'Segoe UI',sans-serif;color:#1A1814">

<div style="flex-grow:1;min-height:0;overflow:hidden">

<div style="display:flex;align-items:center;gap:10px;padding:12px 20px 0">
<div style="flex-grow:1;min-width:0;height:52px;display:flex;align-items:center;gap:6px;padding:0 6px 0 4px;background:#FFFFFF;border:1px solid #E7E4DD;border-radius:26px;box-shadow:0 1px 6px rgba(26,24,20,0.08)">
<a href="Search.dc.html" style="flex-grow:1;min-width:0;height:50px;display:flex;align-items:center;gap:10px;padding-left:12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1814" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<span>
<span style="display:block;font-size:14px;font-weight:700;line-height:18px">Search pianos</span>
<span style="display:block;font-size:12px;font-weight:400;line-height:16px;color:#6B665D">Title, make or customer</span>
</span>
</a>
<a href="Filters.dc.html" aria-label="Filters" style="width:40px;height:40px;flex-shrink:0;border:1px solid #D9D5CC;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#1A1814">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</a>
</div>
<a href="Add1Basics.dc.html" aria-label="Add piano" style="width:44px;height:44px;flex-shrink:0;border-radius:50%;background:#FF9C01;color:#1A1814;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</a>
</div>

<div style="display:flex;margin-top:8px;padding:0 12px;border-bottom:1px solid #E7E4DD">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{t.pick}}" aria-pressed="true" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;border:0;border-bottom:2px solid #1A1814;margin-bottom:-1px;background:none;color:#1A1814;font-size:12px;font-weight:700;line-height:16px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>{{t.label}}</button>
</sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{t.pick}}" aria-pressed="false" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:#6B665D;font-size:12px;font-weight:600;line-height:16px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg>{{t.label}}</button>
</sc-if>
</sc-for>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px 4px 20px">
<div style="font-size:14px;font-weight:500;line-height:20px;color:#6B665D">{{count}}</div>
<div style="display:flex;align-items:center">
<a href="Filters.dc.html" style="display:flex;align-items:center;gap:4px;height:44px;padding:0 8px;font-size:14px;font-weight:600;color:#1A1814">Latest added
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></a>
<button type="button" onClick="{{toggleLayout}}" aria-label="{{layoutLabel}}" style="width:44px;height:44px;border:0;background:none;color:#1A1814;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{layoutIcon}}"/></svg>
</button>
</div>
</div>

<sc-if value="{{isGrid}}" hint-placeholder-val="{{ true }}">
<div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:20px 12px;padding:4px 20px 0">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<a href="Detail.dc.html" style="display:block;min-width:0">
<div style="position:relative;height:169px;border-radius:16px;overflow:hidden;background:#E9E1D3">
<svg width="100%" height="100%" viewBox="0 0 160 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="160" fill="{{p.wall}}"/><rect y="112" width="160" height="48" fill="{{p.floor}}"/><ellipse cx="80" cy="115" rx="52" ry="4.5" fill="#1A1814" fill-opacity="0.14"/><g transform="translate(28 40) scale(1.3)"><rect x="8" y="8" width="64" height="6" rx="2" fill="{{p.dark}}"/><rect x="11" y="14" width="58" height="22" rx="1.5" fill="{{p.body}}"/><rect x="17" y="19" width="46" height="12" rx="1" fill="{{p.panel}}"/><rect x="8" y="36" width="64" height="4" rx="1.5" fill="{{p.dark}}"/><rect x="13" y="40" width="54" height="7" fill="#F7F3EA"/><path d="M18.4 40v7M23.8 40v7M29.2 40v7M34.6 40v7M40 40v7M45.4 40v7M50.8 40v7M56.2 40v7M61.6 40v7" stroke="#D2CABB" stroke-width="0.6"/><rect x="17.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="22.6" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="33.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="38.8" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="44.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="55" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="60.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="11" y="47" width="58" height="5" fill="{{p.body}}"/><rect x="11" y="47" width="5" height="11" rx="1" fill="{{p.dark}}"/><rect x="64" y="47" width="5" height="11" rx="1" fill="{{p.dark}}"/></g></svg>
<sc-if value="{{p.badgeRed}}" hint-placeholder-val="{{ false }}">
<span style="position:absolute;left:8px;top:8px;padding:2px 9px;border-radius:999px;background:#C4321C;color:#FFFFFF;font-size:12px;font-weight:700;line-height:18px">{{p.badge}}</span>
</sc-if>
<sc-if value="{{p.badgeSoft}}" hint-placeholder-val="{{ false }}">
<span style="position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;background:#FFFFFF;color:#1A1814;font-size:12px;font-weight:700;line-height:18px"><span style="width:7px;height:7px;border-radius:50%;background:#FF9C01"></span>{{p.badge}}</span>
</sc-if>
<span style="position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#FFFFFF;color:#1A1814;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"/></svg></span>
</div>
<div style="margin-top:10px;font-size:15px;font-weight:600;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.title}}</div>
<div style="font-size:14px;font-weight:400;line-height:20px;color:#6B665D;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.company}}</div>
<div style="font-size:14px;font-weight:400;line-height:20px;color:#6B665D;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span style="font-weight:700;color:#1A1814">{{p.price}}</span>{{p.rest}}</div>
</a>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isList}}" hint-placeholder-val="{{ false }}">
<div>
<sc-for list="{{items}}" as="p" hint-placeholder-count="6">
<a href="Detail.dc.html" style="display:flex;padding-left:20px">
<div style="padding:12px 14px 12px 0">
<div style="width:64px;height:64px;border-radius:12px;overflow:hidden;background:#E9E1D3">
<svg width="100%" height="100%" viewBox="0 0 160 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="160" fill="{{p.wall}}"/><rect y="112" width="160" height="48" fill="{{p.floor}}"/><ellipse cx="80" cy="115" rx="52" ry="4.5" fill="#1A1814" fill-opacity="0.14"/><g transform="translate(28 40) scale(1.3)"><rect x="8" y="8" width="64" height="6" rx="2" fill="{{p.dark}}"/><rect x="11" y="14" width="58" height="22" rx="1.5" fill="{{p.body}}"/><rect x="17" y="19" width="46" height="12" rx="1" fill="{{p.panel}}"/><rect x="8" y="36" width="64" height="4" rx="1.5" fill="{{p.dark}}"/><rect x="13" y="40" width="54" height="7" fill="#F7F3EA"/><path d="M18.4 40v7M23.8 40v7M29.2 40v7M34.6 40v7M40 40v7M45.4 40v7M50.8 40v7M56.2 40v7M61.6 40v7" stroke="#D2CABB" stroke-width="0.6"/><rect x="17.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="22.6" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="33.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="38.8" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="44.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="55" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="60.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="11" y="47" width="58" height="5" fill="{{p.body}}"/><rect x="11" y="47" width="5" height="11" rx="1" fill="{{p.dark}}"/><rect x="64" y="47" width="5" height="11" rx="1" fill="{{p.dark}}"/></g></svg>
</div>
</div>
<div style="flex-grow:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:12px 20px 12px 0;border-bottom:1px solid #E7E4DD">
<div style="flex-grow:1;min-width:0">
<div style="font-size:16px;font-weight:600;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.title}}</div>
<div style="font-size:14px;font-weight:400;line-height:20px;color:#6B665D;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{p.catLabel}} · {{p.company}}</div>
<div style="font-size:14px;font-weight:600;line-height:20px;color:{{p.tone}}">{{p.status}}</div>
</div>
<div style="font-size:16px;font-weight:600;line-height:22px;font-variant-numeric:tabular-nums">{{p.price}}</div>
</div>
</a>
</sc-for>
</div>
</sc-if>

</div>

<nav aria-label="Main" style="height:84px;flex-shrink:0;display:flex;padding-top:8px;background:#FFFFFF;border-top:1px solid #E7E4DD">
<a href="Main.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#77716A;font-size:11px;font-weight:600;line-height:14px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Today</a>
<a href="Pianos.dc.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#1A1814;font-size:11px;font-weight:700;line-height:14px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M9 19v-4M15 19v-4M7.5 5v6M12 5v6M16.5 5v6"/></svg>Pianos</a>
<a href="Account.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#77716A;font-size:11px;font-weight:600;line-height:14px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>Account</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { cat: 'all', layout: 'grid' };
  renderVals() {
    const RED = '#C4321C', ORG = '#A85D00', GRY = '#6B665D';
    const P = {
      walnut: { wall: '#E9E1D3', floor: '#D8CDBB', body: '#6A5545', dark: '#4A3B30', panel: '#57453A' },
      ebony: { wall: '#DDE3DC', floor: '#C9D1C7', body: '#34302E', dark: '#24211F', panel: '#2B2826' },
      mahogany: { wall: '#E8DDD9', floor: '#D8CBC6', body: '#7A3E2F', dark: '#5A2B20', panel: '#683528' },
      oak: { wall: '#E1E6EA', floor: '#CFD5DB', body: '#B08A5E', dark: '#8C6A43', panel: '#9C7A50' },
      white: { wall: '#EFE9E0', floor: '#DDD5C8', body: '#F4F1EA', dark: '#D9D3C6', panel: '#E6E0D3' }
    };
    const ICON = {
      rentable: 'M12 15a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM11 12l9-9M16 7l3 3',
      events: 'M9 18V5l11-2v13M9 18a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zM20 16a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z',
      sale: 'M3.5 12.5V4.5h8l9 9-8 8-9-9zM8 8.5h.01',
      warehouse: 'M3 8l9-5 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5M12 13v8',
      all: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z'
    };
    const LBL = { rentable: 'Rentable', events: 'Events', sale: 'On sale', warehouse: 'Warehouse' };
    const ALL = [
      { title: 'Young Chang U-121', company: 'The Piano Services', cat: 'rentable', badge: 'Overdue · 9 months', bt: 'red', price: '₹4,500', rest: '', status: 'Overdue · 9 months', tone: RED, pal: 'walnut' },
      { title: 'Samick SU-118', company: 'Kirpalsons', cat: 'rentable', badge: '', bt: '', price: '₹3,800', rest: ' · 12 days left', status: '12 days left', tone: GRY, pal: 'ebony' },
      { title: 'Schimmel W114', company: 'Shamshersons', cat: 'rentable', badge: 'Ends in 3 days', bt: 'soft', price: '₹6,200', rest: '', status: 'Ends in 3 days', tone: ORG, pal: 'white' },
      { title: 'Weber W-121', company: 'RS Music Center', cat: 'rentable', badge: 'Overdue · 18 days', bt: 'red', price: '₹5,000', rest: '', status: 'Overdue · 18 days', tone: RED, pal: 'mahogany' },
      { title: 'Petrof P118', company: 'The Piano Services', cat: 'rentable', badge: '', bt: '', price: '₹4,000', rest: ' · 2 months left', status: '2 months left', tone: GRY, pal: 'oak' },
      { title: 'Estonia 190 Grand', company: 'Shamshersons', cat: 'events', badge: '', bt: '', price: '₹7,80,000', rest: '', status: 'Event stock', tone: GRY, pal: 'ebony' },
      { title: 'Rameau Upright', company: 'Kirpalsons', cat: 'sale', badge: '', bt: '', price: '₹1,15,000', rest: '', status: 'Listed for sale', tone: GRY, pal: 'walnut' },
      { title: 'Kreutzer K-108', company: 'RS Music Center', cat: 'sale', badge: '', bt: '', price: '₹95,000', rest: '', status: 'Listed for sale', tone: GRY, pal: 'mahogany' },
      { title: 'Ronish R-112', company: 'The Piano Services', cat: 'warehouse', badge: '', bt: '', price: '', rest: 'Stored since Mar 2026', status: 'Stored since Mar 2026', tone: GRY, pal: 'oak' },
      { title: 'Fukuyama F-120', company: 'Shamshersons', cat: 'warehouse', badge: '', bt: '', price: '', rest: 'Stored since Jun 2026', status: 'Stored since Jun 2026', tone: GRY, pal: 'white' }
    ];
    const f = this.state.cat;
    const items = ALL.filter((p) => f === 'all' || p.cat === f).map((p) => ({
      title: p.title, company: p.company, price: p.price, rest: p.rest, status: p.status, tone: p.tone,
      badge: p.badge, badgeRed: p.bt === 'red', badgeSoft: p.bt === 'soft',
      icon: ICON[p.cat], catLabel: LBL[p.cat],
      wall: P[p.pal].wall, floor: P[p.pal].floor, body: P[p.pal].body, dark: P[p.pal].dark, panel: P[p.pal].panel
    }));
    const defs = [['all', 'All'], ['rentable', 'Rentable'], ['events', 'Events'], ['sale', 'On sale'], ['warehouse', 'Warehouse']];
    const tabs = defs.map(([k, label]) => ({ label, icon: ICON[k], on: f === k, off: f !== k, pick: () => this.setState({ cat: k }) }));
    const grid = this.state.layout === 'grid';
    return {
      tabs, items, isGrid: grid, isList: !grid,
      count: items.length + (items.length === 1 ? ' piano' : ' pianos'),
      layoutIcon: grid ? 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01' : 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
      layoutLabel: grid ? 'Show as list' : 'Show as grid',
      toggleLayout: () => this.setState({ layout: grid ? 'list' : 'grid' })
    };
  }
}
</script>
</body>
</html>
