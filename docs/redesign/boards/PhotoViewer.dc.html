<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F0E0C;font-family:'Figtree',-apple-system,'Segoe UI',sans-serif;color:#FFFFFF;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
@keyframes pv-hint{0%,10%{opacity:0;transform:translateY(6px)}20%,70%{opacity:1;transform:none}85%,100%{opacity:0}}
.pv-hint{animation:pv-hint 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pv-hint{animation:none;opacity:1}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#0F0E0C;display:flex;flex-direction:column;overflow:hidden;font-family:'Figtree',-apple-system,'Segoe UI',sans-serif;color:#FFFFFF">

<div style="display:flex;align-items:center;justify-content:space-between;height:56px;padding:8px 8px 0;flex-shrink:0">
<a href="Detail.dc.html" aria-label="Close photos" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
</a>
<div style="font-size:15px;font-weight:600">2 of 4</div>
<button type="button" aria-label="More options" style="width:44px;height:44px;border:0;background:none;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
</button>
</div>

<div style="position:relative;flex-grow:1;min-height:0;display:flex;align-items:center;justify-content:center">
<div style="width:390px;height:460px;overflow:hidden">
<svg width="390" height="460" viewBox="0 0 160 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="160" fill="#DDE3DC"/><rect y="112" width="160" height="48" fill="#C9D1C7"/><ellipse cx="80" cy="115" rx="52" ry="4.5" fill="#1A1814" fill-opacity="0.14"/><g transform="translate(28 40) scale(1.3)"><rect x="8" y="8" width="64" height="6" rx="2" fill="#24211F"/><rect x="11" y="14" width="58" height="22" rx="1.5" fill="#34302E"/><rect x="17" y="19" width="46" height="12" rx="1" fill="#2B2826"/><rect x="8" y="36" width="64" height="4" rx="1.5" fill="#24211F"/><rect x="13" y="40" width="54" height="7" fill="#F7F3EA"/><path d="M18.4 40v7M23.8 40v7M29.2 40v7M34.6 40v7M40 40v7M45.4 40v7M50.8 40v7M56.2 40v7M61.6 40v7" stroke="#D2CABB" stroke-width="0.6"/><rect x="17.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="22.6" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="33.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="38.8" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="44.2" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="55" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="60.4" y="40" width="2.4" height="4.5" fill="#2B2320"/><rect x="11" y="47" width="58" height="5" fill="#34302E"/><rect x="11" y="47" width="5" height="11" rx="1" fill="#24211F"/><rect x="64" y="47" width="5" height="11" rx="1" fill="#24211F"/></g></svg>
</div>
<div class="pv-hint" style="position:absolute;left:50%;bottom:20px;margin-left:-100px;width:200px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:rgba(15,14,12,0.8);font-size:13px;font-weight:600">Pinch or double-tap to zoom</div>
</div>

<div style="flex-shrink:0;padding:16px 20px 0">
<div style="display:flex;gap:10px;justify-content:center">
<div style="width:56px;height:56px;border-radius:10px;background:#E9E1D3;opacity:0.6"></div>
<div style="width:56px;height:56px;border-radius:10px;background:#DDE3DC;box-shadow:0 0 0 2px #FF9C01"></div>
<div style="width:56px;height:56px;border-radius:10px;background:#E8DDD9;opacity:0.6"></div>
<div style="width:56px;height:56px;border-radius:10px;background:#E1E6EA;opacity:0.6"></div>
</div>
<div style="display:flex;gap:10px;margin-top:20px;padding-bottom:32px">
<button type="button" style="flex:1;height:48px;border:0;border-radius:14px;background:rgba(255,255,255,0.14);color:#FFFFFF;font-size:15px;font-weight:600">Set as cover</button>
<button type="button" style="flex:1;height:48px;border:0;border-radius:14px;background:rgba(255,255,255,0.14);color:#FF8F7F;font-size:15px;font-weight:600">Delete photo</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
