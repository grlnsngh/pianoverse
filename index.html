<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pianoverse - Password Reset Service</title>
    <style>
        :root {
            --primary-color: #161622;
            --secondary-color: #FFA001;
            --text-light: #ffffff;
            --text-muted: #d1d5db;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--primary-color);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Background decorative elements */
        .background-decoration {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            z-index: 1;
        }

        .decoration-circle {
            position: absolute;
            border-radius: 50%;
            background: var(--secondary-color);
            opacity: 0.1;
        }

        .decoration-circle.circle-1 {
            width: 200px;
            height: 200px;
            top: -50px;
            right: -50px;
        }

        .decoration-circle.circle-2 {
            width: 150px;
            height: 150px;
            bottom: 100px;
            left: -75px;
        }

        .decoration-circle.circle-3 {
            width: 100px;
            height: 100px;
            top: 50%;
            right: 20%;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px var(--shadow);
            text-align: center;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--secondary-color);
        }

        .title {
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
        }

        .description {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .button {
            background: linear-gradient(135deg, var(--secondary-color), #ff8c00);
            color: var(--primary-color);
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 160, 1, 0.3);
            cursor: pointer;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 160, 1, 0.4);
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: var(--text-muted);
            opacity: 0.8;
        }

        .footer a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }

            .logo {
                font-size: 32px;
            }

            .title {
                font-size: 24px;
            }

            .description {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="background-decoration">
        <div class="decoration-circle circle-1"></div>
        <div class="decoration-circle circle-2"></div>
        <div class="decoration-circle circle-3"></div>
    </div>

    <div class="container">
        <div class="logo">🎹 Pianoverse</div>

        <h1 class="title">Password Reset Service</h1>

        <p class="description">
            Welcome to Pianoverse's secure password reset service. If you're here, you've likely received an email with a password reset link for your account.
        </p>

        <a href="reset-password.html" class="button">
            Go to Password Reset
        </a>

        <div class="footer">
            <p>Need help? <a href="mailto:support@pianoverse.com">Contact Support</a></p>
            <p>&copy; 2025 Pianoverse. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
